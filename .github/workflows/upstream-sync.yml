name: Sync upstream MiroTalk

# AOB Speakeasy — upstream (miroslavpejic85/mirotalk) master'ını
# bizim master'a otomatik merge eder. Temiz merge'de push'lar (Coolify
# webhook'u deploy'u tetikler). Çakışma olursa abort eder ve job FAIL olur
# (bozuk merge canlıya gitmez). Manuel de tetiklenebilir (workflow_dispatch).

on:
  schedule:
    - cron: '0 4 * * *' # her gün 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (master, full history)
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable "ours" merge driver
        # .gitattributes pins fork-owned files (README, SECURITY, CODE_OF_CONDUCT,
        # FUNDING) with `merge=ours`. That attribute is inert unless the driver exists —
        # `true` is a no-op command, which tells git to keep our version. Without this
        # step every upstream edit to those files would conflict and fail the sync.
        run: git config merge.ours.driver true

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/miroslavpejic85/mirotalk.git
          git fetch --no-tags upstream master

      - name: Merge upstream/master (abort on conflict)
        run: |
          set -euo pipefail
          if git diff --quiet HEAD upstream/master; then
            echo "Zaten guncel — yapilacak bir sey yok."
            exit 0
          fi
          if git merge --no-edit upstream/master; then
            echo "Merge basarili."
          else
            echo "::error::Upstream ile cakisma — abort edildi, manuel inceleme gerekiyor."
            git merge --abort
            exit 1
          fi

      - name: Push to fork master
        run: git push origin HEAD:master
