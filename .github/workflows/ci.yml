name: CI

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-22.04 # LTS
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'  # LTS

      - name: Install dependencies
        run: npm install

      - name: Create config from template
        run: cp app/src/config.template.js app/src/config.js

      - name: Run unit tests
        run: npm test

  # NOTE (Speakeasy fork): upstream's Docker Hub "build" job was removed.
  # We don't publish to Docker Hub — Coolify builds the image directly from
  # the Dockerfile on each push to master. Re-adding it would fail without
  # DOCKERHUB_* secrets and would push to upstream's mirotalk/p2p repo.
