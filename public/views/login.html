<!doctype html>
<html lang="en" class="no-js">
    <head>
        <!-- Title and Icon -->

        <title id="loginTitle">Speakeasy - members only</title>
        <link id="shortcutIcon" rel="shortcut icon" href="../images/favicon.png" />
        <link id="appleTouchIcon" rel="apple-touch-icon" href="../images/logo.png" />

        <!-- Meta Information -->

        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta
            name="description"
            content="A hidden little spot for private video calls. No downloads, no fuss - knock twice, say the word, and slip inside. What's said here, stays here."
        />

        <!-- https://ogp.me -->

        <meta property="og:type" content="{{OG_TYPE}}" />
        <meta property="og:site_name" content="{{OG_SITE_NAME}}" />
        <meta property="og:title" content="{{OG_TITLE}}" />
        <meta property="og:description" content="{{OG_DESCRIPTION}}" />
        <meta property="og:image" content="{{OG_IMAGE}}" />
        <meta property="og:url" content="{{OG_URL}}" />

        <!-- StyleSheet -->

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=IBM+Plex+Sans:400,600" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" />
        <link rel="stylesheet" href="../css/_tokens.css" />
        <link rel="stylesheet" href="../css/landing.css" />
        <link rel="stylesheet" href="../css/login.css" />
        <link rel="stylesheet" href="../css/translate.css" />
        <link rel="stylesheet" href="../css/aob-login.css" />

        <!-- Js scripts -->

        <script async src="../js/stats.js"></script>
        <script async src="../js/translate.js"></script>

        <script src="https://unpkg.com/animejs@3.0.1/lib/anime.min.js"></script>
        <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>

        <!-- xss -->
        <script src="https://cdn.jsdelivr.net/npm/xss/dist/xss.min.js"></script>

        <!-- axios -->
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

        <!-- sweetalert -->
        <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.8"></script>
    </head>
    <body class="has-animations aob-auth">
        <div id="google_translate_element"></div>

        <div class="body-wrap">
            <header class="site-header reveal-from-top">
                <div class="container">
                    <div class="site-header-inner">
                        <div class="brand">
                            <div class="m-0"></div>
                        </div>
                    </div>
                </div>
            </header>
            <main class="site-content mt-32">
                <section class="hero section">
                    <div class="container">
                        <div class="hero-inner section-inner">
                            <div class="split-wrap invert-mobile">
                                <div class="split-item">
                                    <div class="hero-content split-item-content center-content-mobile">
                                        <div
                                            id="loginForm"
                                            class="login-card reveal-from-bottom"
                                            data-reveal-delay="150"
                                            role="form"
                                            aria-label="Login"
                                        >
                                            <div class="login-icon">
                                                <img src="../images/logo.png" alt="Speakeasy" />
                                            </div>
                                            <h2 id="loginHeading" class="login-title">Speakeasy</h2>
                                            <p id="loginDescription" class="login-description">
                                                Knock twice &mdash; it stays between us.
                                            </p>
                                            <div class="login-input-group">
                                                <i class="fa-solid fa-user"></i>
                                                <input
                                                    id="username"
                                                    class="form-input"
                                                    type="name"
                                                    placeholder="Username"
                                                    maxlength="254"
                                                    required
                                                />
                                            </div>
                                            <div class="login-input-group">
                                                <i class="fa-solid fa-key"></i>
                                                <input
                                                    id="password"
                                                    class="form-input"
                                                    type="password"
                                                    maxlength="32"
                                                    placeholder="Password"
                                                    required
                                                />
                                                <i id="togglePassword" class="fa-solid fa-eye toggle-password"></i>
                                            </div>
                                            <button id="loginButton" class="login-btn pulse">
                                                <i class="fa-solid fa-right-to-bracket"></i>&nbsp;
                                                <span id="loginButtonLabel">Login</span>
                                            </button>
                                        </div>
                                        <!-- Join Room Section hidden -->
                                        <div id="joinRoomForm" class="login-card">
                                            <div class="login-icon">
                                                <i class="fa-solid fa-video"></i>
                                            </div>
                                            <h2 id="joinRoomTitle" class="join-room-title">
                                                Name your hideout.<br />
                                                Pass the word.<br />
                                                Let them in.
                                            </h2>
                                            <div class="room-input-row">
                                                <div class="login-input-group">
                                                    <i class="fa-solid fa-door-open"></i>
                                                    <input
                                                        id="roomName"
                                                        class="form-input"
                                                        type="text"
                                                        placeholder="Enter room name"
                                                        maxlength="64"
                                                        required
                                                    />
                                                </div>
                                                <button
                                                    id="randomRoomButton"
                                                    class="random-room-btn"
                                                    title="Generate random room name"
                                                >
                                                    <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
                                                </button>
                                                <button
                                                    id="shareRoomButton"
                                                    class="share-room-btn"
                                                    title="Share room link"
                                                >
                                                    <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
                                                </button>
                                            </div>
                                            <button id="joinSelectRoomButton" class="join-room-btn">
                                                <i class="fa-solid fa-right-to-bracket"></i>&nbsp;
                                                <span id="joinRoomButtonLabel">JOIN ROOM</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>

            <footer id="footer" class="site-footer" style="text-align:center;">
                <div class="container">
                    <div class="footer-copyright" style="text-align:center;padding:14px 0;font-size:12px;">
                        @AOBASAR &mdash; made with &#10084;&#65039; San Diego, CA
                        <a href="https://github.com/aobasar/Speakeasy" target="_blank" rel="noopener" style="opacity:0.16;">&middot; Source</a>
                        <br />
                        <a href="https://github.com/miroslavpejic85/mirotalk" target="_blank" rel="noopener" style="opacity:0.45;">Based on MiroTalk (AGPLv3)</a>
                    </div>
                </div>
            </footer>
        </div>

        <script defer src="../js/utils.js"></script>
        <script defer src="../js/aob-rooms.js"></script>
        <script defer src="../js/login.js"></script>
        <script defer src="../js/brand.js"></script>
        <script defer src="../js/landing.js"></script>
    </body>
</html>
